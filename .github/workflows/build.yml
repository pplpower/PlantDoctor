name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PlantDoctor-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PlantDoctor.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PlantDoctor.apk --title "Зелёный доктор (последняя сборка)" --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте PlantDoctor.apk на телефон и установите." --latest
